# SAURon — Tableau de bord eau (Home Assistant natif)
#
# Aucun composant frontend HACS requis : cartes natives uniquement.
# Exemple validé sur une installation réelle : adaptez TOUS les entity_id
# (préfixe sensor.toute_la_maison_compteur_eau_saur_) à votre compteur.
# Les identifiants peuvent varier selon le nom du périphérique et la langue.
#
# Statistique Recorder : Outils de développement > Statistiques
# Exemple : sauron:daily_water_01m19z0fc5tj1r6y1ab9zv2fva
# IMPORTANT : remplacer aussi le statistic_id par celui de votre installation.
# Il s'agit d'un identifiant de statistique, PAS d'un sensor.
#
# L'index estimé reste utile pour afficher le niveau cumulatif.
# Les graphiques historiques utilisent les statistiques datées SAURon.
# Ne pas ajouter deux sources d'eau pour le même compteur dans Énergie.

title: Eau
views:
  - title: Consommation eau
    path: eau-sauron
    icon: mdi:water
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Consommation d'eau
            heading_style: title
            icon: mdi:water

          - type: tile
            entity: sensor.toute_la_maison_compteur_eau_saur_index_eau_estime
            name: Index estimé
            icon: mdi:counter

          - type: tile
            entity: sensor.toute_la_maison_compteur_eau_saur_consommation_j_1
            name: Dernière consommation publiée
            icon: mdi:water-outline

          - type: tile
            entity: sensor.toute_la_maison_compteur_eau_saur_age_des_donnees
            name: Âge des données SAUR
            icon: mdi:clock-outline

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Consommations
            heading_style: title
            icon: mdi:chart-bar

          - type: tile
            entity: sensor.toute_la_maison_compteur_eau_saur_consommation_semaine_courante
            name: Cette semaine
            icon: mdi:calendar-week

          - type: tile
            entity: sensor.toute_la_maison_compteur_eau_saur_consommation_semaine_precedente
            name: Semaine précédente
            icon: mdi:calendar-week

          - type: tile
            entity: sensor.toute_la_maison_compteur_eau_saur_consommation_mensuelle
            name: Ce mois
            icon: mdi:calendar-month

          - type: tile
            entity: sensor.toute_la_maison_compteur_eau_saur_consommation_annuelle
            name: Cette année
            icon: mdi:calendar-year

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Historique des consommations
            heading_style: title
            icon: mdi:chart-bar

          - type: statistics-graph
            grid_options:
              columns: full
            title: Consommation journalière — 7 jours
            chart_type: bar
            period: day
            days_to_show: 7
            stat_types:
              - change
            entities:
              - entity: sauron:daily_water_01m19z0fc5tj1r6y1ab9zv2fva

          - type: statistics-graph
            grid_options:
              columns: full
            title: Consommation journalière — 30 jours
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - entity: sauron:daily_water_01m19z0fc5tj1r6y1ab9zv2fva

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Informations et diagnostic
            heading_style: title
            icon: mdi:information-outline

          - type: grid
            columns: 3
            square: false
            grid_options:
              columns: full
            cards:
              - type: entities
                title: Compteur
                entities:
                  - entity: sensor.toute_la_maison_compteur_eau_saur_index_eau_estime
                    name: Index estimé
                  - entity: sensor.toute_la_maison_compteur_eau_saur_index_eau
                    name: Dernier index physique SAUR
                  - entity: sensor.toute_la_maison_compteur_eau_saur_date_dernier_releve
                    name: Date du relevé physique
                  - entity: sensor.toute_la_maison_compteur_eau_saur_consommation_j_1
                    name: Dernière consommation publiée
                  - entity: sensor.toute_la_maison_compteur_eau_saur_date_derniere_consommation_journaliere
                    name: Date de cette consommation

              - type: entities
                title: Fraîcheur des données
                entities:
                  - entity: sensor.toute_la_maison_compteur_eau_saur_age_des_donnees
                    name: Âge de la dernière consommation publiée
                  - entity: sensor.toute_la_maison_compteur_eau_saur_dernier_polling_reussi
                    name: Dernier polling réussi

              - type: entities
                title: Compteur physique
                entities:
                  - entity: sensor.toute_la_maison_compteur_eau_saur_numero_de_serie_du_compteur
                    name: Numéro de série
                  - entity: sensor.toute_la_maison_compteur_eau_saur_fabricant_du_compteur
                    name: Fabricant
                  - entity: sensor.toute_la_maison_compteur_eau_saur_modele_du_compteur
                    name: Modèle
                  - entity: sensor.toute_la_maison_compteur_eau_saur_diametre_du_compteur
                    name: Diamètre
                  - entity: sensor.toute_la_maison_compteur_eau_saur_technologie_de_telereleve
                    name: Télérelève
