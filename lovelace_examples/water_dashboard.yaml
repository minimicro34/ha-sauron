# SAURon — Tableau de bord eau (Home Assistant natif)
#
# Aucun composant frontend HACS requis : cartes natives uniquement.
# Remplacer les entity_id selon votre installation et le statistic_id ci-dessous.
#
# Statistique Recorder : Outils de développement > Statistiques
# Exemple : sauron:daily_water_01m19z0fc5tj1r6y1ab9zv2fva
# IMPORTANT : remplacer l'identifiant d'exemple par celui de votre installation.
#
# L'index estimé reste utile pour afficher le niveau cumulatif.
# Les graphiques historiques utilisent les statistiques datées SAURon.
# Ne pas ajouter deux sources d'eau pour le même compteur dans Énergie.

title: Eau
views:
  - title: Consommation eau
    path: eau-sauron
    icon: mdi:water
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Consommation d'eau
            heading_style: title
            icon: mdi:water

          - type: tile
            entity: sensor.saur_water_meter_index_eau_estime
            name: Index estimé
            icon: mdi:counter

          - type: tile
            entity: sensor.saur_water_meter_derniere_consommation_journaliere
            name: Dernière consommation publiée
            icon: mdi:water-outline

          - type: tile
            entity: sensor.saur_water_meter_age_des_donnees
            name: Âge des données SAUR
            icon: mdi:clock-outline

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Consommations
            heading_style: title
            icon: mdi:chart-bar

          - type: tile
            entity: sensor.saur_water_meter_consommation_semaine_courante
            name: Cette semaine
            icon: mdi:calendar-week

          - type: tile
            entity: sensor.saur_water_meter_consommation_mensuelle
            name: Ce mois
            icon: mdi:calendar-month

          - type: tile
            entity: sensor.saur_water_meter_consommation_annuelle
            name: Cette année
            icon: mdi:calendar-year

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Historique quotidien — 7 jours
            heading_style: title
            icon: mdi:chart-bar

          - type: statistics-graph
            title: Consommation journalière réelle
            chart_type: bar
            period: day
            days_to_show: 7
            stat_types:
              - change
            entities:
              - entity: sauron:daily_water_REPLACE_WITH_CONFIG_ENTRY_ID

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Historique quotidien — 30 jours
            heading_style: title
            icon: mdi:chart-line

          - type: statistics-graph
            title: Consommation journalière réelle
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - entity: sauron:daily_water_REPLACE_WITH_CONFIG_ENTRY_ID

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Compteur
            heading_style: title
            icon: mdi:gauge

          - type: entities
            entities:
              - entity: sensor.saur_water_meter_index_eau_estime
                name: Index estimé
              - entity: sensor.saur_water_meter_index_eau
                name: Dernier index physique SAUR
              - entity: sensor.saur_water_meter_date_dernier_releve
                name: Date du relevé physique
              - entity: sensor.saur_water_meter_derniere_consommation_journaliere
                name: Dernière consommation publiée
              - entity: sensor.saur_water_meter_date_derniere_consommation_journaliere
                name: Date de cette consommation

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Diagnostic
            heading_style: title
            icon: mdi:information-outline

          - type: entities
            title: Fraîcheur des données
            entities:
              - entity: sensor.saur_water_meter_age_des_donnees
                name: Âge de la dernière consommation publiée
              # Optionnel : renseigner l'entity_id réel du diagnostic
              # « Dernière interrogation réussie » si vous voulez le voir ici.
              # - entity: sensor.saur_water_meter_derniere_interrogation_reussie
              #   name: Dernière interrogation réussie

          - type: entities
            title: Compteur physique
            entities:
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: serial_number
                name: Numéro de série
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: manufacturer
                name: Fabricant
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: model
                name: Modèle
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: diameter
                name: Diamètre
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: telereleve
                name: Télérelève
