# SAURon — Exemple de tableau de bord eau
#
# Prerequis HACS frontend :
#   - Mushroom
#   - ApexCharts Card
#
# Noms d'entites ci-dessous : installation Home Assistant en francais.
# Adaptez-les si Home Assistant a genere des entity_id differents.
#
# SAURon :
#   sensor.saur_water_meter_index_eau_estime                         index cumulatif reconstruit
#   sensor.saur_water_meter_index_eau                                dernier index physique SAUR
#   sensor.saur_water_meter_date_dernier_releve                      date du releve physique
#   sensor.saur_water_meter_derniere_consommation_journaliere        derniere valeur quotidienne disponible
#   sensor.saur_water_meter_date_derniere_consommation_journaliere   date de cette valeur quotidienne
#   sensor.saur_water_meter_consommation_semaine_courante            semaine en cours
#   sensor.saur_water_meter_consommation_mensuelle                   mois en cours
#   sensor.saur_water_meter_consommation_annuelle                    annee en cours
#   sensor.saur_water_meter_age_des_donnees                          diagnostic
#
# utility_meter optionnels :
#   sensor.water_daily
#   sensor.water_monthly
#
# IMPORTANT : l'index physique SAUR ne change qu'au passage du technicien.
# Les graphiques et utility_meter doivent donc utiliser l'index estime.

title: Eau
views:
  - title: Consommation eau
    path: eau-sauron
    icon: mdi:water
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-title-card
            title: "Consommation d'eau"
            subtitle: "SAUR · suivi du compteur"

          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: sensor.saur_water_meter_index_eau_estime
                icon: mdi:counter
                tap_action:
                  action: more-info
              - type: entity
                entity: sensor.saur_water_meter_derniere_consommation_journaliere
                icon: mdi:water-outline
                tap_action:
                  action: more-info
              - type: entity
                entity: sensor.saur_water_meter_age_des_donnees
                icon: mdi:clock-outline
                tap_action:
                  action: more-info

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Consommation"
            heading_style: title
            icon: mdi:chart-bar

          - type: custom:mushroom-entity-card
            entity: sensor.saur_water_meter_derniere_consommation_journaliere
            name: "Derniere consommation journaliere"
            icon: mdi:water-outline
            layout: vertical

          - type: custom:mushroom-entity-card
            entity: sensor.saur_water_meter_consommation_semaine_courante
            name: "Cette semaine"
            icon: mdi:calendar-week
            layout: vertical

          - type: custom:mushroom-entity-card
            entity: sensor.saur_water_meter_consommation_mensuelle
            name: "Ce mois"
            icon: mdi:calendar-month
            layout: vertical

          - type: custom:mushroom-entity-card
            entity: sensor.saur_water_meter_consommation_annuelle
            name: "Cette annee"
            icon: mdi:calendar-year
            layout: vertical

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "7 derniers jours"
            heading_style: title
            icon: mdi:chart-bar

          - type: custom:apexcharts-card
            header:
              show: true
              title: "Consommation quotidienne"
              show_states: false
            graph_span: 7d
            span:
              end: day
            apex_config:
              chart:
                type: bar
                height: 280
              yaxis:
                min: 0
            series:
              - entity: sensor.saur_water_meter_index_eau_estime
                name: "Consommation"
                type: column
                group_by:
                  func: diff
                  duration: 1d
                  fill: last
                show:
                  legend_value: false

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "30 derniers jours"
            heading_style: title
            icon: mdi:chart-line

          - type: custom:apexcharts-card
            header:
              show: true
              title: "Tendance quotidienne"
              show_states: false
            graph_span: 30d
            span:
              end: day
            apex_config:
              chart:
                type: area
                height: 280
              yaxis:
                min: 0
            series:
              - entity: sensor.saur_water_meter_index_eau_estime
                name: "Consommation"
                group_by:
                  func: diff
                  duration: 1d
                  fill: last

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "Compteur"
            heading_style: title
            icon: mdi:gauge

          - type: custom:mushroom-entity-card
            entity: sensor.saur_water_meter_index_eau_estime
            name: "Index estime"
            icon: mdi:counter
            primary_info: state
            secondary_info: name
            tap_action:
              action: more-info

          - type: custom:mushroom-entity-card
            entity: sensor.saur_water_meter_derniere_consommation_journaliere
            name: "Derniere consommation"
            icon: mdi:water
            primary_info: state
            secondary_info: name

          - type: custom:mushroom-entity-card
            entity: sensor.saur_water_meter_date_derniere_consommation_journaliere
            name: "Date de cette consommation"
            icon: mdi:calendar-clock
            primary_info: state
            secondary_info: name

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "Compteurs periodiques"
            heading_style: title
            icon: mdi:autorenew

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.water_daily
                state_not: unavailable
            card:
              type: custom:mushroom-entity-card
              entity: sensor.water_daily
              name: "Journalier"
              icon: mdi:water-sync

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.water_monthly
                state_not: unavailable
            card:
              type: custom:mushroom-entity-card
              entity: sensor.water_monthly
              name: "Mensuel"
              icon: mdi:calendar-month

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Diagnostic"
            heading_style: subtitle
            icon: mdi:information-outline

          - type: custom:mushroom-template-card
            entity: sensor.saur_water_meter_age_des_donnees
            primary: "Etat de la collecte SAUR"
            secondary: >-
              {% set h = states('sensor.saur_water_meter_age_des_donnees') | float(0) %}
              {% if h < 1 %}
                Donnees actualisees il y a moins d'une heure
              {% elif h < 12 %}
                Donnees actualisees il y a {{ h | round(1) }} h
              {% elif h < 36 %}
                Donnees agees de {{ h | round(1) }} h
              {% else %}
                Donnees potentiellement obsoletes : {{ h | round(1) }} h
              {% endif %}
            icon: mdi:clock-outline
            icon_color: >-
              {% set h = states('sensor.saur_water_meter_age_des_donnees') | float(0) %}
              {% if h < 12 %}green{% elif h < 36 %}orange{% else %}red{% endif %}
            tap_action:
              action: more-info

          - type: entities
            title: "Releve et reconstruction"
            show_header_toggle: false
            entities:
              - entity: sensor.saur_water_meter_index_eau_estime
                name: "Index estime"
                icon: mdi:counter
              - entity: sensor.saur_water_meter_index_eau
                name: "Dernier index physique SAUR"
                icon: mdi:gauge
              - entity: sensor.saur_water_meter_date_dernier_releve
                name: "Date du releve physique"
                icon: mdi:calendar-check
              - entity: sensor.saur_water_meter_date_derniere_consommation_journaliere
                name: "Date derniere consommation journaliere"
                icon: mdi:calendar-clock
              - entity: sensor.saur_water_meter_age_des_donnees
                name: "Age des donnees"
                icon: mdi:clock-outline

          - type: entities
            title: "Compteur physique"
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: serial_number
                name: "N° de serie"
                icon: mdi:barcode
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: manufacturer
                name: "Fabricant"
                icon: mdi:factory
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: model
                name: "Modele"
                icon: mdi:tag-outline
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: diameter
                name: "Diametre"
                icon: mdi:pipe
              - type: attribute
                entity: sensor.saur_water_meter_index_eau
                attribute: telereleve
                name: "Telereleve"
                icon: mdi:antenna
