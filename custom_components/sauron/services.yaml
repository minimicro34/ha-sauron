preview_historical:
  name: Preview historical consumption
  description: Read historical SAUR daily data without writing to Recorder or the daily ledger. Maximum interval is 36 days.
  fields:
    entry_id:
      name: Configuration entry ID
      description: SAURon configuration entry ID.
      required: true
      example: 01M19Z0FC5TJ1R6Y1AB9ZV2FVA
      selector:
        text:
    start:
      name: Start date
      description: First day to inspect (YYYY-MM-DD).
      required: true
      example: "2023-10-16"
      selector:
        date:
    end:
      name: End date
      description: Last day to inspect (YYYY-MM-DD).
      required: true
      example: "2023-10-31"
      selector:
        date:

preview_historical_coverage:
  name: Preview historical coverage
  description: Check up to 36 months of SAUR history and compare with the persisted daily ledger. Recorder is not compared or modified.
  fields:
    entry_id:
      name: Configuration entry ID
      required: true
      selector:
        text:
    start:
      name: Start date
      required: true
      selector:
        date:
    end:
      name: End date
      required: true
      selector:
        date:

import_historical:
  name: Import historical consumption
  description: Manually queue a guarded historical Recorder backfill. Existing Recorder rows are verified before writing. Requires explicit confirmation.
  fields:
    entry_id:
      name: Configuration entry ID
      required: true
      selector:
        text:
    start:
      name: Start date
      required: true
      selector:
        date:
    end:
      name: End date
      required: true
      selector:
        date:
    confirm:
      name: Confirm historical import
      description: Must be true to queue a Recorder write.
      required: true
      selector:
        boolean:
